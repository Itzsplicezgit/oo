<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Memers</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: black;
  overflow: hidden;
  color: white;
}

#verifyScreen {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  gap: 15px;
}

#verifyBtn {
  padding: 18px 28px;
  border-radius: 14px;
  border: 1px solid white;
  background: rgba(255,255,255,0.05);
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.upload-btn,
.reload-btn,
.download-btn {
  position: fixed;
  top: 15px;
  width: 90px;
  height: 46px;
  border-radius: 18px;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 999;
  color: black;
  font-size: 14px;
  font-weight: 600;
}

.upload-btn { right: 15px; }
.reload-btn { right: 115px; }
.download-btn { right: 215px; }

input {
  display: none;
}

.feed {
  height: 100vh;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
}

.video-card {
  height: 100vh;
  scroll-snap-align: start;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.overlay {
  position: absolute;
  bottom: 70px;
  left: 15px;
  font-size: 13px;
  opacity: 0.7;
}

.empty {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

.footer {
  position: fixed;
  bottom: 18px;
  width: 100%;
  text-align: center;
  font-size: 13px;
  opacity: 0.5;
}
</style>
</head>
<body>

<div id="verifyScreen">
  <button id="verifyBtn">Yes MEMES</button>
  <div style="opacity:0.7;font-size:12px;text-align:center;color:white;">
    Skibidi
  </div>
</div>

<div class="download-btn" id="downloadBtn">Download</div>
<div class="reload-btn" id="reloadBtn">New Video</div>
<div class="upload-btn" id="uploadBtn">Upload</div>

<input type="file" id="fileInput" accept="video/*" multiple />

<div class="feed" id="feed"></div>

<script>
const verifyScreen = document.getElementById("verifyScreen");
const verifyBtn = document.getElementById("verifyBtn");
const uploadBtn = document.getElementById("uploadBtn");
const reloadBtn = document.getElementById("reloadBtn");
const downloadBtn = document.getElementById("downloadBtn");
const fileInput = document.getElementById("fileInput");
const feed = document.getElementById("feed");

let videos = [];

verifyBtn.onclick = async () => {
  verifyScreen.style.display = "none";
  loadVideos();
};

uploadBtn.onclick = () => fileInput.click();

fileInput.addEventListener("change", async (e) => {
  const files = Array.from(e.target.files);

  const MAX_SIZE = 300 * 1024 * 1024;
  const MAX_DURATION = 120;

  for (const file of files) {
    if (file.size > MAX_SIZE) {
      alert(file.name + " is larger than 300MB");
      continue;
    }

    const duration = await getVideoDuration(file);

    if (duration > MAX_DURATION) {
      alert(file.name + " is longer than 2 minutes");
      continue;
    }

    const formData = new FormData();
    formData.append("videos", file);

    await fetch("/upload", {
      method: "POST",
      body: formData
    });
  }

  loadVideos();
});

reloadBtn.onclick = () => loadVideos();

downloadBtn.onclick = async () => {
  for (const vid of videos) {
    const a = document.createElement("a");
    a.href = vid.url;
    a.download = vid.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    await new Promise(resolve => setTimeout(resolve, 300));
  }
};

async function loadVideos() {
  const res = await fetch("/api/videos");
  videos = await res.json();
  renderRandom();
}

function renderRandom() {
  feed.innerHTML = "";

  if (videos.length === 0) {
    feed.innerHTML = `
      <div class="empty">
        <h2>Yeh server</h2>
        <h2>No users have uploaded videos.</h2>
        <p>Be the first to share something.</p>
      </div>
    `;
    return;
  }

  const v = videos[Math.floor(Math.random() * videos.length)];

  const card = document.createElement("div");
  card.className = "video-card";

  const video = document.createElement("video");
  video.src = v.url;
  video.autoplay = true;
  video.loop = true;
  video.muted = true;
  video.playsInline = true;
  video.controls = true;

  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerText = "anonymous_user • " + v.name;

  card.appendChild(video);
  card.appendChild(overlay);
  feed.appendChild(card);

  video.play().catch(() => {});
}

function getVideoDuration(file) {
  return new Promise(resolve => {
    const video = document.createElement("video");
    video.preload = "metadata";
    video.onloadedmetadata = () => {
      window.URL.revokeObjectURL(video.src);
      resolve(video.duration);
    };
    video.src = URL.createObjectURL(file);
  });
}
</script>

</body>
</html>
